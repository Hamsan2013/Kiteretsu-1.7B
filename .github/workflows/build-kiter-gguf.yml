  name: Build and Quantize Kiter AI GGUF

on:
  workflow_dispatch:

jobs:
  build-gguf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          pip install huggingface_hub torch sentencepiece numpy gguf

      - name: Clone and Build llama.cpp Compiler
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build
          cmake --build build --config Release -j$(nproc)

      - name: Fetch Target Model Weights into Isolated Directory
        run: |
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='Qwen/Qwen2-0.5B-Instruct', local_dir='qwen_base')
          "

      - name: Convert Target Weights to GGUF
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py qwen_base/ --outfile kiter-f16.gguf

      - name: Quantize Model to Q4_K_M
        run: |
          ./llama.cpp/build/bin/llama-quantize kiter-f16.gguf kiter-0.5b-q4_k_m.gguf Q4_K_M

      - name: Upload Custom Kiter GGUF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiter-0.5B-GGUF
          path: kiter-0.5b-q4_k_m.gguf
